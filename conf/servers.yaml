asjard:
  ## servers configuration.
  servers:
    ## server interceptors.
    # interceptors: ""
    ## builtin server interceptors.
    # builtInInterceptors:
    #   - ratelimiter
    #   - metrics
    #   - accessLog
    #   - restReadEntity
    #   - restResponseHeader
    #   - i18n
    #   - trace
    # defaultHandlers: ""
    ## builtin default handlers.
    # builtInDefaultHandlers:
    #   - health
    #   - metrics
    ## relative ASJARD_CERT_DIR
    certFile: ""
    ## relative ASJARD_CERT_DIR
    keyFile: ""

    ## amqp server
    amqp:
      enabled: false
      ## asjard.stores.amqp.client.{name}
      clientName: default
      ## channel qos
      prefetchCount: 1
      prefetchSize: 0
      global: false
    mcp:
      enabeld: true
      addresses:
        listen: 127.0.0.1:6010
      # path: /mcp
      # streamable:
      #   ## Cursor/VS Code often send a hostname Host header on loopback
      #   ## connections; the SDK rejects that with HTTP 403.
      #   disableLocalhostProtection: true
      #   jsonResponse: false
      #   stateless: false
      options:
        # readTimeout: !!str 0s
        # readHeaderTimeout: !!str 0s
        # writeTimeout: !!str 0s
        # idleTimeout: !!str 0s
        # maxHeaderBytes: !!int 0
        # maxRequestBodySize: !!int 20971520
        # disableKeepalive: !!bool false

    ## grpc configuration
    grpc:
      ## enable grpc server
      enabled: false
      addresses:
        ## If the IPv4 address is "0.0.0.0" or the IPv6 address is "::", the address registered in the register will be changed to
        ## The first IPv4 address or the first IPv6 address read by the network card
        # listen: 127.0.0.1:7010
        ## Cross-region access address, you can add IP address and port, or domain name
        # advertise: 47.121.0.5:8080
      options:
        keepaliveParams:
          ## MaxConnectionIdle is a duration for the amount of time after which an
          ## idle connection would be closed by sending a GoAway. Idleness duration is
          ## defined since the most recent time the number of outstanding RPCs became
          ## zero or the connection establishment.
          # maxConnectionIdle: !!str 5m
          ## MaxConnectionAge is a duration for the maximum amount of time a
          ## connection may exist before it will be closed by sending a GoAway. A
          ## random jitter of +/-10% will be added to MaxConnectionAge to spread out
          ## connection storms.
          ## The current default value is infinity.
          # maxConnectionAge: !!str 0s
          ## MaxConnectionAgeGrace is an additive period after MaxConnectionAge after
          ## which the connection will be forcibly closed.
          ## The current default value is infinity.
          # MaxConnectionAgeGrace: !!str 0s
          ## After a duration of this time if the server doesn't see any activity it
          ## pings the client to see if the transport is still alive.
          ## If set below 1s, a minimum value of 1s will be used instead.
          # time: !!str 10s
          ## After having pinged for keepalive check, the server waits for a duration
          ## of Timeout and if no activity is seen even after that the connection is
          ## closed.
          # timeout: !!str 1s
    pprof:
      # enabled: false
      # addresses:
      # listen: 127.0.0.1:7020
    rest:
      enabled: true
      doc:
        ## Error page address. If an error is returned, the default document address that can resolve the error is used.
        ## If not configured, the website configuration is used.
        # errPage: ${asjard.service.website}
      openapi:
        # enabled: false
        ## Document domain name, if empty then
        ## asjard.servers.rest.addresses.advertise
        ## asjard.servers.rest.addresses.listen
        # endpoint: https://example.com
        # page: https://petstore.swagger.io/?url=http://%s/openapi.yml
        # termsOfService: ""
        license:
          # name: "Apache 2.0"
          # url: "http://www.apache.org/licenses/LICENSE-2.0.html"
        scalar:
          # theme: alternate
          # cdn: ""
          # sidebarVisibility: false
          # hideModels: false
          # hideDownloadButton: false
          # darkMode: false
          # hideClients: []
          # authentication: ""
      routes:
        ## if enabled, there will be an additional interface /routes, which returns all the rest routes of the current service
        enabled: true
      ## 国际化是否相关配置
      i18n:
        # enabled: false
      cors:
        # allowAllOrigins: false
        # allowOrigins: "*"
        # allowMethods:
        #   - GET
        #   - HEAD
        #   - PUT
        #   - PATCH
        #   - POST
        #   - DELETE
        # allowHeaders:
        #   - Origin
        #   - Content-Length
        #   - Content-Type
        # exposeHeaders: ""
        # allowCredentials: false
      ## 同grpc相关配置
      addresses:
        # listen: 127.0.0.1:7030
        # advertise: 127.0.0.1:7030
      ## REST uses net/http.Server. See https://pkg.go.dev/net/http#Server
      # options:
      #   ## ReadTimeout is the maximum duration for reading the entire
      #   ## request, including the body. Default: 30s.
      #   readTimeout: !!str 30s

      #   ## ReadHeaderTimeout is the amount of time allowed to read
      #   ## request headers. Default: 10s.
      #   readHeaderTimeout: !!str 10s

      #   ## WriteTimeout is the maximum duration before timing out
      #   ## writes of the response. Default: unlimited (0).
      #   writeTimeout: !!str 0s

      #   ## IdleTimeout is the maximum amount of time to wait for the
      #   ## next request when keep-alive is enabled. Default: 60s.
      #   idleTimeout: !!str 60s

      #   ## MaxHeaderBytes controls the maximum number of bytes the
      #   ## server will read parsing the request header.
      #   maxHeaderBytes: !!int 0

      #   ## Maximum request body size.
      #   ## Default: 20 * 1024 * 1024
      #   maxRequestBodySize: !!int 20971520

      #   ## Whether to disable keep-alive connections.
      #   ## Default: false
      #   disableKeepalive: !!bool false
    asynq:
      enabled: false
      redis: default
      options:
        concurrency: 0
        strictPriority: false
        shutdownTimeout: 0s
        healthCheckInterval: 0s
        delayTaskCheckInterval: 0s
        groupGracePeriod: 0s
        groupMaxDelay: 0s
        groupMaxSize: 0
